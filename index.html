<style>
:root{
  --bg:#FAFAF8; --ink:#3D4248; --ink-soft:#8A9097; --line:#E8E7E2;
  --card:#FFFFFF; --accent:#B5342E; --accent-soft:#FBEFEE;
  --ok:#2E7D53; --ok-soft:#EAF5EF; --no:#B5342E; --no-soft:#FBEFEE;
  --gold:#C9A227; --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  min-height:100vh; display:flex; flex-direction:column;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; max-width:640px; width:100%; margin:0 auto;
}
.logo{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink)}
.logo svg{display:block}
.logo span{font-weight:700; font-size:1.02rem; letter-spacing:-.01em}
.lang-btn{
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:7px 14px; font-size:.85rem; font-weight:600; color:var(--ink);
  transition:box-shadow .15s;
}
.lang-btn:hover{box-shadow:0 2px 8px rgba(61,66,72,.08)}

/* ---------- layout ---------- */
main{flex:1; width:100%; max-width:640px; margin:0 auto; padding:8px 20px 48px}
.screen{display:none; animation:fadeUp .35s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- landing ---------- */
.hero{
  background:var(--card); border:1px solid var(--line); border-radius:28px;
  padding:44px 28px 40px; text-align:center; position:relative; overflow:hidden;
  box-shadow:0 10px 30px rgba(61,66,72,.06); margin-top:8px;
}
.pennants{position:absolute; top:0; left:0; right:0; height:0; pointer-events:none}
.pennant{position:absolute; top:-2px; width:0; height:0;
  border-left:13px solid transparent; border-right:13px solid transparent;}
.hero-cap{font-size:3.4rem; line-height:1; display:inline-block; animation:capFloat 3.2s ease-in-out infinite}
@keyframes capFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.hero h1{font-size:1.9rem; font-weight:800; letter-spacing:-.03em; margin:16px 0 8px}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero p.sub{color:var(--ink-soft); font-size:.98rem; max-width:400px; margin:0 auto}
.hero-badges{display:flex; gap:8px; justify-content:center; margin:20px 0 26px; flex-wrap:wrap}
.badge{border:1px solid var(--line); background:var(--bg); border-radius:999px;
  padding:6px 13px; font-size:.8rem; font-weight:600; color:var(--ink-soft)}
.btn-primary{
  display:inline-block; background:var(--ink); color:#fff; font-weight:700; font-size:1.05rem;
  border-radius:999px; padding:16px 44px; transition:transform .12s, box-shadow .12s;
  box-shadow:0 6px 18px rgba(61,66,72,.22);
}
.btn-primary:active{transform:scale(.97)}
.best{margin-top:16px; font-size:.85rem; color:var(--ink-soft)}
.best b{color:var(--gold)}

/* ---------- quiz ---------- */
.quiz-top{display:flex; align-items:center; justify-content:space-between; margin:10px 2px 12px}
.q-count{font-size:.85rem; font-weight:700; color:var(--ink-soft); letter-spacing:.02em}
.q-score{font-size:.85rem; font-weight:700; color:var(--accent)}
.gauge{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:22px}
.gauge>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--ink),var(--accent)); border-radius:99px; transition:width .35s ease}
.q-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:28px 24px; box-shadow:0 8px 24px rgba(61,66,72,.05);
}
.q-tag{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.06em;
  color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:4px 9px; margin-bottom:14px}
.q-text{font-size:1.22rem; font-weight:700; letter-spacing:-.02em; word-break:keep-all}
.choices{display:grid; gap:10px; margin-top:22px}
.choices.ox{grid-template-columns:1fr 1fr}
.choice{
  border:1.5px solid var(--line); background:var(--bg); border-radius:14px;
  padding:15px 16px; font-size:1rem; font-weight:600; text-align:left; color:var(--ink);
  transition:border-color .12s, background .12s, transform .1s; word-break:keep-all;
}
.choices.ox .choice{text-align:center; font-size:1.8rem; padding:22px 0}
.choice:not(:disabled):hover{border-color:var(--ink)}
.choice:not(:disabled):active{transform:scale(.98)}
.choice.correct{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.choice.wrong{border-color:var(--no); background:var(--no-soft); color:var(--no)}
.choice:disabled{cursor:default; opacity:.92}

/* pass stamp */
.q-card{position:relative}
.stamp{
  position:absolute; top:14px; right:16px; font-weight:800; font-size:1rem; letter-spacing:.1em;
  padding:6px 12px; border:2.5px solid; border-radius:8px; transform:rotate(10deg) scale(1.6); opacity:0;
  pointer-events:none;
}
.stamp.show{animation:stampIn .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{to{opacity:1; transform:rotate(-8deg) scale(1)}}
.stamp.pass{color:var(--ok); border-color:var(--ok)}
.stamp.fail{color:var(--no); border-color:var(--no)}

.fact{
  margin-top:16px; background:var(--bg); border:1px dashed var(--line); border-radius:12px;
  padding:13px 15px; font-size:.9rem; color:var(--ink-soft); display:none; word-break:keep-all;
}
.fact.show{display:block; animation:fadeUp .3s ease both}
.next-wrap{margin-top:18px; text-align:right; min-height:48px}
.btn-next{
  background:var(--ink); color:#fff; font-weight:700; border-radius:999px; padding:12px 28px;
  font-size:.95rem; display:none;
}
.btn-next.show{display:inline-block; animation:fadeUp .25s ease both}

/* ---------- result ---------- */
.res-card{
  background:var(--card); border:1px solid var(--line); border-radius:28px;
  padding:40px 26px 34px; text-align:center; box-shadow:0 10px 30px rgba(61,66,72,.06);
}
.res-emoji{font-size:3rem}
.res-tier{font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin:10px 0 4px}
.res-score{color:var(--ink-soft); font-size:1rem}
.res-score b{color:var(--accent); font-size:1.25rem}
.res-msg{margin:14px auto 0; max-width:380px; color:var(--ink-soft); font-size:.93rem; word-break:keep-all}
.res-actions{display:flex; gap:10px; justify-content:center; margin-top:26px; flex-wrap:wrap}
.btn-ghost{
  border:1.5px solid var(--ink); border-radius:999px; padding:13px 26px; font-weight:700; font-size:.95rem;
}
canvas#shareCanvas{display:none}
.card-preview{margin-top:22px; display:none}
.card-preview img{width:100%; max-width:340px; border-radius:16px; border:1px solid var(--line); box-shadow:0 8px 24px rgba(61,66,72,.1)}

/* ---------- affiliate ---------- */
.aff{
  margin-top:22px; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:20px 22px; text-align:center;
}
.aff p{font-size:.92rem; color:var(--ink-soft); margin-bottom:12px; word-break:keep-all}
.aff a{
  display:inline-block; text-decoration:none; background:var(--accent); color:#fff;
  font-weight:700; font-size:.92rem; border-radius:999px; padding:11px 24px;
}
.disclosure{margin-top:12px; font-size:.72rem; color:#B4B8BC}

/* ---------- footer ---------- */
footer{
  border-top:1px solid var(--line); padding:26px 20px 34px; text-align:center;
  font-size:.8rem; color:var(--ink-soft);
}
footer a{color:var(--ink-soft)}
footer .slogan{font-weight:600; color:var(--ink); margin-bottom:4px}

/* ---------- consent ---------- */
.consent{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:50; max-width:520px; margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:18px 20px; box-shadow:0 12px 36px rgba(61,66,72,.18); display:none;
}
.consent.on{display:block; animation:fadeUp .3s ease both}
.consent p{font-size:.85rem; color:var(--ink-soft); word-break:keep-all}
.consent .c-actions{display:flex; gap:8px; margin-top:12px; justify-content:flex-end}
.consent button{border-radius:999px; padding:9px 18px; font-size:.85rem; font-weight:700}
.c-accept{background:var(--ink); color:#fff}
.c-decline{border:1px solid var(--line); color:var(--ink-soft)}
@media (max-width:420px){
  .hero h1{font-size:1.6rem}
  .q-text{font-size:1.1rem}
}
</style>

/* ---------------- state ---------------- */
let lang = localStorage.getItem('oo_lang') || (navigator.language && navigator.language.startsWith('ko') ? 'ko' : 'en');
let deck = [], idx = 0, score = 0, locked = false;
const $ = id => document.getElementById(id);
const T = () => I18N[lang];

/* ---------------- utils ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function ga(name, params){ if(typeof gtag==='function') gtag('event', name, params||{}); }

/* ---------------- pennants (hero deco) ---------------- */
(function(){
  const colors=['#B5342E','#3D4248','#C9A227','#2E7D53','#8A9097'];
  const box=$('pennants'); let html='';
  for(let i=0;i<12;i++){
    html+=`<span class="pennant" style="left:${3+i*8.2}%;border-top:20px solid ${colors[i%colors.length]};opacity:.85"></span>`;
  }
  box.innerHTML=html;
})();

/* ---------------- i18n render ---------------- */
function renderStatic(){
  const t=T();
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang==='ko' ? 'EN' : '한국어';
  $('tTitle').innerHTML = t.title;
  $('tSub').textContent = t.sub;
  $('tB1').textContent=t.b1; $('tB2').textContent=t.b2; $('tB3').textContent=t.b3;
  $('btnStart').textContent = t.start;
  const best = localStorage.getItem('oo_univ_best_'+lang);
  $('tBest').innerHTML = best!==null ? t.best+`<b>${best} / ${ROUND}</b>` : t.bestNone;
  $('btnNext').textContent = t.next;
  $('btnShare').textContent = t.share;
  $('btnRetry').textContent = t.retry;
  /* affiliate */
  $('affText').textContent = t.aff;
  const link = $('affLink');
  link.textContent = t.affBtn;
  link.href = lang==='ko' ? COUPANG_URL : AMAZON_URL;
  $('affDisclosure').textContent = t.disclosure;
  const noLink = (lang==='ko' && COUPANG_URL==='COUPANG_URL') || (lang==='en' && AMAZON_URL==='AMAZON_URL');
  $('affBox').style.display = noLink ? 'none' : 'block';
}

$('langBtn').addEventListener('click', ()=>{
  lang = lang==='ko' ? 'en' : 'ko';
  localStorage.setItem('oo_lang', lang);
  renderStatic(); renderConsentText();
  show('scrHome');
  ga('language_change',{language:lang});
});

/* ---------------- screens ---------------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({top:0});
}

/* ---------------- quiz flow ---------------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnRetry').addEventListener('click', startQuiz);
$('btnNext').addEventListener('click', nextQ);

function startQuiz(){
  deck = shuffle(lang==='ko' ? Q_KO : Q_EN).slice(0, ROUND);
  idx = 0; score = 0;
  show('scrQuiz'); renderQ();
  ga('quiz_start',{language:lang});
}

function renderQ(){
  const t=T(), q=deck[idx];
  locked=false;
  $('qCount').textContent = t.count(idx+1, ROUND);
  $('qScore').textContent = t.score(score);
  $('gaugeBar').style.width = (idx/ROUND*100)+'%';
  $('qTag').textContent = q.t==='ox' ? t.tagOX : t.tagMC;
  $('qText').textContent = q.q;
  $('qFact').className='fact'; $('qFact').textContent='';
  $('btnNext').className='btn-next';
  $('btnNext').textContent = idx===ROUND-1 ? t.finish : t.next;
  const st=$('stamp'); st.className='stamp'; st.textContent='';

  const box=$('choices'); box.innerHTML='';
  if(q.t==='ox'){
    box.className='choices ox';
    t.ox.forEach((label,i)=>{
      const b=document.createElement('button');
      b.className='choice'; b.textContent=label;
      b.addEventListener('click', ()=>answer(i===0, b, q));
      box.appendChild(b);
    });
  }else{
    box.className='choices';
    const order = shuffle(q.c.map((_,i)=>i));
    order.forEach(ci=>{
      const b=document.createElement('button');
      b.className='choice'; b.textContent=q.c[ci]; b.dataset.ci=ci;
      b.addEventListener('click', ()=>answer(ci===q.a, b, q));
      box.appendChild(b);
    });
  }
}

function answer(userVal, btn, q){
  if(locked) return; locked=true;
  const t=T();
  const correct = q.t==='ox' ? (userVal===q.a) : userVal;
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled=true;
    if(q.t==='ox'){
      const isO = b.textContent===t.ox[0];
      if(isO===q.a) b.classList.add('correct');
    }else if(Number(b.dataset.ci)===q.a){
      b.classList.add('correct');
    }
  });
  if(!correct) btn.classList.add('wrong');
  if(correct) score++;
  $('qScore').textContent = t.score(score);

  const st=$('stamp');
  st.textContent = correct ? t.pass : t.fail;
  st.className = 'stamp show ' + (correct?'pass':'fail');

  if(q.f){ $('qFact').textContent='💡 '+q.f; $('qFact').classList.add('show'); }
  $('btnNext').classList.add('show');
}

function nextQ(){
  idx++;
  if(idx>=ROUND){ showResult(); } else { renderQ(); }
}

/* ---------------- result ---------------- */
function tierOf(s){ return T().tiers.find(t=>s>=t.min); }

function showResult(){
  const t=T(), tier=tierOf(score);
  $('gaugeBar').style.width='100%';
  $('resEmoji').textContent = tier.e;
  $('resTier').textContent = tier.t;
  $('resScore').innerHTML = t.resScore(score, ROUND);
  $('resMsg').textContent = tier.m;
  $('cardPreview').style.display='none'; $('cardPreview').innerHTML='';
  const key='oo_univ_best_'+lang;
  const prev=localStorage.getItem(key);
  if(prev===null || score>Number(prev)) localStorage.setItem(key, score);
  show('scrResult');
  drawCard(tier);
  ga('quiz_complete',{language:lang, score:score, tier:tier.t});
}

/* ---------------- share card ---------------- */
function drawCard(tier){
  const cv=$('shareCanvas'), x=cv.getContext('2d'), W=1080, H=1080;
  x.fillStyle='#FAFAF8'; x.fillRect(0,0,W,H);
  /* pennant garland */
  const cols=['#B5342E','#3D4248','#C9A227','#2E7D53','#8A9097'];
  for(let i=0;i<12;i++){
    const px=60+i*82;
    x.fillStyle=cols[i%cols.length];
    x.beginPath(); x.moveTo(px,0); x.lineTo(px+52,0); x.lineTo(px+26,68); x.closePath(); x.fill();
  }
  /* logo mark */
  x.strokeStyle='#3D4248'; x.lineWidth=16; x.lineCap='round';
  x.beginPath(); x.arc(W/2,208,44,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W/2,252+8); x.lineTo(W/2,308); x.stroke();
  x.fillStyle='#3D4248'; x.textAlign='center';
  x.font='700 40px Pretendard, sans-serif';
  x.fillText('OnlyOne', W/2, 372);

  x.font='600 44px Pretendard, sans-serif'; x.fillStyle='#8A9097';
  x.fillText(lang==='ko'?'대학잘알 테스트':'Campus IQ', W/2, 460);

  x.font='140px sans-serif';
  x.fillText(tier.e, W/2, 620);

  x.fillStyle='#3D4248'; x.font='800 84px Pretendard, sans-serif';
  x.fillText(tier.t, W/2, 740);

  x.fillStyle='#B5342E'; x.font='800 64px Pretendard, sans-serif';
  x.fillText(score+' / '+ROUND, W/2, 830);

  x.fillStyle='#8A9097'; x.font='500 34px Pretendard, sans-serif';
  x.fillText(HUB_URL, W/2, 980);
  x.strokeStyle='#E8E7E2'; x.lineWidth=2;
  x.beginPath(); x.moveTo(120,920); x.lineTo(W-120,920); x.stroke();
}

$('btnShare').addEventListener('click', async ()=>{
  const t=T(), cv=$('shareCanvas');
  ga('share_click',{language:lang, score:score});
  cv.toBlob(async blob=>{
    const file=new File([blob], 'campus-iq.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:t.shareTitle, text:t.shareText(score)});
        return;
      }catch(e){ if(e && e.name==='AbortError') return; }
    }
    /* fallback: clipboard → download */
    try{
      if(navigator.clipboard && window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      }
    }catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='campus-iq.png'; a.click();
    URL.revokeObjectURL(a.href);
    /* show preview so users can long-press save on mobile */
    const img=new Image(); img.src=cv.toDataURL('image/png');
    const pv=$('cardPreview'); pv.innerHTML=''; pv.appendChild(img); pv.style.display='block';
  }, 'image/png');
});

/* ---------------- consent (GA4 Consent Mode v2) ---------------- */
function isEEA(){
  try{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    return tz.startsWith('Europe/');
  }catch(e){ return false; }
}
function grantAnalytics(){
  gtag('consent','update',{analytics_storage:'granted'});
}
function renderConsentText(){
  const t=T(), eea=isEEA();
  $('consentText').textContent = eea ? t.consentEEA : t.consentSoft;
  $('cAccept').textContent = eea ? t.accept : t.okBtn;
  $('cDecline').textContent = t.decline;
  $('cDecline').style.display = eea ? '' : 'none';
}
(function initConsent(){
  const saved=localStorage.getItem('oo_consent');
  if(saved==='granted'){ grantAnalytics(); return; }
  if(saved==='denied' && isEEA()) return;
  if(!isEEA() && saved==='seen'){ grantAnalytics(); return; }
  renderConsentText();
  $('consentBox').classList.add('on');
  $('cAccept').addEventListener('click', ()=>{
    localStorage.setItem('oo_consent', isEEA()?'granted':'seen');
    grantAnalytics();
    $('consentBox').classList.remove('on');
  });
  $('cDecline').addEventListener('click', ()=>{
    localStorage.setItem('oo_consent','denied');
    $('consentBox').classList.remove('on');
  });
})();

/* ---------------- init ---------------- */
renderStatic();
</script>
